spring.application.name=chatop-api

# .env loading: see DotenvApplicationInitializer registered explicitly in ChatopApiApplication.main()

# The Angular front-end expects the API on localhost:3001 (see src/environments/environment.ts)
server.port=${SERVER_PORT:3001}

# Database credentials are provided via environment variables, never hardcoded
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chatop_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is managed by the provided SQL script, Hibernate only validates it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rental picture upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://localhost:3001}

# The front-end expects snake_case JSON keys (created_at, updated_at, owner_id...)
spring.jackson.property-naming-strategy=SNAKE_CASE
